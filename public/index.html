<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 21px; }
    .auth p { margin: 8px 0 14px; font-size: 14px; }
    .auth label { display: block; margin: 10px 0 5px; font-size: 14px; font-weight: 700; }
    .auth input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #667b93; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    .auth button { margin-top: 14px; padding: 10px 18px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .auth-error { color: #ffb6c4; }
    .note-section { margin-top: 26px; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .note-section h2 { margin: 0 0 12px; font-size: 21px; }
    .note-section p { margin: 6px 0 12px; font-size: 14px; }
    .note-section label { display: block; font-size: 14px; margin: 10px 0 5px; font-weight: 700; }
    .note-section input, .note-section textarea { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid #667b93; border-radius: 8px; background: #101a28; color: #ecf4ff; font: inherit; }
    .note-section textarea { min-height: 110px; resize: vertical; }
    .note-section button { margin: 10px 8px 0 0; padding: 8px 14px; border: 0; border-radius: 8px; background: #8ad8df; color: #101a28; font: inherit; cursor: pointer; }
    .note-section button:disabled { opacity: .6; cursor: wait; }
    .note-section li button { font-size: 13px; }
    .note-section .note-error { color: #ffb6c4; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 4단계 소유자 접근 제한</div>
    <h1>내 자료실</h1>
    <p>로그인 계정에 속한 실습용 가상 메모만 조회하고 관리합니다.</p>
    <div class="notice">서버에서 로그인과 메모 소유자를 확인하여 다른 계정의 자료 접근을 거부합니다. DB 권한·RLS 강화는 다음 제작에서 진행합니다. 실제 개인정보는 넣지 마세요.</div>
    <section class="auth" aria-labelledby="auth-heading">
      <h2 id="auth-heading">이메일 로그인</h2>
      <p id="auth-status" role="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form">
        <label for="login-email">이메일</label>
        <input id="login-email" type="email" autocomplete="username" required>
        <label for="login-password">비밀번호</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p id="signed-in-email"></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
    </section>
    <p id="notes-locked">로그인하면 가상 메모를 확인할 수 있습니다.</p>
    <section id="own-notes-section" class="note-section" hidden aria-labelledby="own-notes-heading">
      <h2 id="own-notes-heading">내 가상 메모</h2>
      <form id="note-form">
        <label for="note-title">제목</label>
        <input id="note-title" type="text" maxlength="160" required placeholder="실습용 가상 제목">
        <label for="note-body">내용</label>
        <textarea id="note-body" maxlength="4000" required placeholder="실습용 가상 내용만 입력하세요"></textarea>
        <button id="note-save" type="submit">가상 메모 추가</button>
        <button id="note-cancel" type="button" hidden>수정 취소</button>
      </form>
      <p id="note-error" class="note-error" role="alert" hidden></p>
      <ul id="notes" aria-live="polite"><li>내 메모를 불러오는 중입니다.</li></ul>
    </section>
    <section id="sample-section" class="note-section" hidden aria-labelledby="sample-heading">
      <h2 id="sample-heading">내 기존 실습용 가상 자료 (읽기 전용)</h2>
      <ul id="sample-notes" aria-live="polite"></ul>
    </section>
  </main>
  <script type="module">
    // 3단계 제작 1: 공개용 값만 입력합니다. 서버 전용 Secret key는 절대 넣지 않습니다.
    const projectUrl = 'https://tlfyygqfuqqfnmtxkghb.supabase.co';
    const publishableKey = 'sb_publishable_u1rJENMNeQb_1OgwI2R_TQ_YZ0NP6-E';

    const status = document.querySelector('#auth-status');
    const errorText = document.querySelector('#auth-error');
    const loginForm = document.querySelector('#login-form');
    const signedIn = document.querySelector('#signed-in');
    const signedInEmail = document.querySelector('#signed-in-email');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const emailInput = document.querySelector('#login-email');
    const passwordInput = document.querySelector('#login-password');
    const notesList = document.querySelector('#notes');
    const sampleList = document.querySelector('#sample-notes');
    const ownSection = document.querySelector('#own-notes-section');
    const sampleSection = document.querySelector('#sample-section');
    const notesLocked = document.querySelector('#notes-locked');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteSave = document.querySelector('#note-save');
    const noteCancel = document.querySelector('#note-cancel');
    const noteError = document.querySelector('#note-error');
    let notesRequestNumber = 0;
    let activeSession = null;
    let currentNotes = [];
    let editingNoteId = null;
    let supabase;

    function showNoteMessage(message) {
      const item = document.createElement('li');
      item.textContent = message;
      notesList.replaceChildren(item);
    }

    function showNoteError(message) {
      noteError.textContent = message;
      noteError.hidden = !message;
    }

    function resetNoteForm() {
      noteForm.reset();
      editingNoteId = null;
      noteSave.textContent = '가상 메모 추가';
      noteCancel.hidden = true;
    }

    async function authFetch(path, options = {}) {
      const { data, error } = await supabase.auth.getSession();
      if (error || !data?.session?.access_token) throw new Error('로그인이 필요합니다.');
      const headers = { Authorization: `Bearer ${data.session.access_token}` };
      if (options.body) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        ...options, headers, cache: 'no-store', credentials: 'omit',
      });
      if (!response.ok) {
        if (response.status === 401) throw new Error('로그인이 만료되었거나 인증되지 않았습니다.');
        if (response.status === 404) throw new Error('메모가 존재하지 않습니다.');
        if (response.status === 409) throw new Error('이미 있는 메모 ID입니다.');
        throw new Error(`메모 요청 실패 (HTTP ${response.status})`);
      }
      return response.json();
    }

    function renderOwnedNotes(notes) {
      currentNotes = notes;
      if (notes.length === 0) {
        showNoteMessage('아직 추가한 가상 메모가 없습니다.');
        return;
      }
      notesList.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        const edit = document.createElement('button');
        const remove = document.createElement('button');
        title.textContent = note.title;
        content.textContent = note.body;
        edit.textContent = '수정';
        remove.textContent = '삭제';
        edit.type = 'button';
        remove.type = 'button';
        edit.addEventListener('click', () => {
          editingNoteId = note.id;
          noteTitle.value = note.title;
          noteBody.value = note.body;
          noteSave.textContent = '수정 저장';
          noteCancel.hidden = false;
          noteTitle.focus();
        });
        remove.addEventListener('click', async () => {
          if (!window.confirm('이 가상 메모를 삭제할까요?')) return;
          showNoteError('');
          remove.disabled = true;
          try {
            await authFetch(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
            if (editingNoteId === note.id) resetNoteForm();
            await loadNotes(activeSession);
          } catch (error) {
            showNoteError(error.message);
          } finally {
            remove.disabled = false;
          }
        });
        item.append(title, content, document.createElement('div'), edit, remove);
        return item;
      }));
    }

    async function loadNotes(session) {
      const requestNumber = ++notesRequestNumber;
      activeSession = session;
      const signedIn = Boolean(session?.access_token);
      notesLocked.hidden = signedIn;
      ownSection.hidden = !signedIn;
      sampleSection.hidden = !signedIn;
      if (!signedIn) {
        currentNotes = [];
        resetNoteForm();
        showNoteError('');
        notesList.replaceChildren();
        sampleList.replaceChildren();
        return;
      }
      showNoteMessage('가상 메모를 불러오는 중입니다.');
      try {
        const data = await authFetch('/api/notes');
        if (!Array.isArray(data.notes) || !Array.isArray(data.sampleNotes)) {
          throw new Error('자료 형식이 맞지 않습니다.');
        }
        if (requestNumber !== notesRequestNumber) return;
        renderOwnedNotes(data.notes);
        // A에게 소유권이 있는 기존 4건만 표시하고 B에게는 빈 구역을 숨깁니다.
        sampleSection.hidden = data.sampleNotes.length === 0;
        sampleList.replaceChildren(...data.sampleNotes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch {
        if (requestNumber === notesRequestNumber) {
          showNoteMessage('메모를 불러오지 못했습니다. 로그인과 DB 설정을 확인해 주세요.');
          sampleList.replaceChildren();
        }
      }
    }

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      showNoteError('');
      noteSave.disabled = true;
      try {
        const path = editingNoteId ? `/api/notes/${encodeURIComponent(editingNoteId)}` : '/api/notes';
        await authFetch(path, {
          method: editingNoteId ? 'PUT' : 'POST',
          body: JSON.stringify({ title: noteTitle.value.trim(), body: noteBody.value.trim() }),
        });
        resetNoteForm();
        await loadNotes(activeSession);
      } catch (error) {
        showNoteError(error.message);
      } finally {
        noteSave.disabled = false;
      }
    });
    noteCancel.addEventListener('click', () => resetNoteForm());

    function showError(message) {
      errorText.textContent = message;
      errorText.hidden = !message;
    }

    function updateAuth(user) {
      loginForm.hidden = Boolean(user);
      signedIn.hidden = !user;
      status.textContent = user ? '로그인됨' : '로그아웃 상태';
      signedInEmail.textContent = user ? `로그인 계정: ${user.email ?? '확인됨'}` : '';
      if (user) passwordInput.value = '';
    }

    if (!projectUrl || !publishableKey) {
      status.textContent = '로그인 설정이 필요합니다.';
      loginButton.disabled = true;
      showError('public/index.html에 공개용 Supabase Project URL과 publishable key를 입력해 주세요.');
    } else if (!publishableKey.startsWith('sb_publishable_')) {
      status.textContent = '로그인 설정을 확인해 주세요.';
      loginButton.disabled = true;
      showError('공개용 sb_publishable_ 키만 사용할 수 있습니다. 서버 전용 Secret key는 사용하지 마세요.');
    } else {
      try {
        const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
        supabase = createClient(projectUrl, publishableKey);
        // SDK가 로그인 세션을 관리합니다. JWT 또는 비밀번호를 직접 저장하거나 만들지 않습니다.
        supabase.auth.onAuthStateChange((_event, session) => {
          updateAuth(session?.user ?? null);
          void loadNotes(session);
        });

        loginForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          showError('');
          loginButton.disabled = true;
          try {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: emailInput.value.trim(),
              password: passwordInput.value,
            });
            if (error) throw error;
            if (!data?.user || !data?.session) throw new Error('로그인 세션을 받지 못했습니다. 이메일 인증 상태를 확인해 주세요.');
            updateAuth(data.user);
          } catch (error) {
            showError(`로그인 실패: ${error.message || '로그인 요청을 처리하지 못했습니다.'}`);
          } finally {
            passwordInput.value = '';
            loginButton.disabled = false;
          }
        });

        logoutButton.addEventListener('click', async () => {
          showError('');
          logoutButton.disabled = true;
          try {
            const { error } = await supabase.auth.signOut({ scope: 'local' });
            if (error) throw error;
            updateAuth(null);
            void loadNotes(null);
          } catch (error) {
            showError(`로그아웃 실패: ${error.message || '로그아웃 요청을 처리하지 못했습니다.'}`);
          } finally {
            logoutButton.disabled = false;
          }
        });
      } catch {
        status.textContent = '로그인을 시작할 수 없습니다.';
        loginButton.disabled = true;
        showError('Supabase 로그인 모듈을 불러오지 못했습니다. 네트워크와 공개 설정값을 확인해 주세요.');
      }
    }
  </script>
</body>
</html>
